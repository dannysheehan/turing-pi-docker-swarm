---
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      controller-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
