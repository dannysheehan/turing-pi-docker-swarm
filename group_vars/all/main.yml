---
ansible_user: dietpi
ansible_become: true

dietpi_min_version: "10.6"
# DietPi mode 0 delegates live time synchronization to Chrony. Replacement
# images use mode 4 until Ansible has installed Chrony.
dietpi_ntp_mode: 0
dietpi_firstboot_ntp_mode: 4
dietpi_ntp_mirror: default
dietpi_base_chrony_pool: 2.debian.pool.ntp.org
dietpi_base_chrony_max_correction_seconds: 0.05
dietpi_ramlog_size_mb: 50
dietpi_min_root_free_mb: 512

swarm_vip_prefix: 24
swarm_primary_manager: tpi-mgr-01
swarm_autolock: false

docker_dietpi_software_ids:
  - 162
  - 134
docker_data_root: /mnt/dietpi_userdata/docker-data
docker_engine_version: 29.7.2

# Portainer (deployed by 04-services / portainer role)
portainer_enabled: true
portainer_version: 2.39.6
portainer_primary_manager: "{{ swarm_primary_manager }}"
portainer_data_dir: /mnt/dietpi_userdata/portainer-data
portainer_https_port: 9443
portainer_database_secret_name: portainer_database_key  # pragma: allowlist secret
portainer_backup_passphrase: >-
  {{
    lookup('community.general.onepassword', portainer_backup_secret_reference)
    | b64encode | b64decode
  }}
# One-time acknowledgement for encrypting an existing plaintext database.
portainer_database_encryption_confirm: false
portainer_admin_username: admin
portainer_admin_password: "{{ vault_portainer_admin_password | default('') }}"
# true only on a fresh install (then run 06-portainer-setup.yml)
portainer_auto_setup: false

# Shared NFS storage (mounted once per manager, apps bind subdirs).
nfs_mount: /srv/nfs
nfs_opts: "vers=3,hard,proto=tcp,timeo=600,retrans=2,_netdev,nofail,x-systemd.automount"
portainer_backup_retention_days: 14
portainer_backup_hour: 3
portainer_backup_minute: 30
backup_passphrase: "{{ vault_backup_passphrase | default('') }}"

os_maintenance_patches: true
os_maintenance_reboot: true
keepalived_interface: eth0
keepalived_virtual_router_id: 51
keepalived_auth_pass: "{{ vault_keepalived_auth_pass | default('') }}"

# Traefik + Komodo (deployed by 04-services / traefik + komodo roles)
traefik_version: "v3.5"
traefik_stack_name: traefik
traefik_replicas: 3
traefik_stack_dir: /opt/ansible/traefik
traefik_edge_network: edge
traefik_backend_network: komodo_back
traefik_acme_storage_dir: /mnt/dietpi_userdata/traefik
traefik_komodo_backend_url: http://komodo-core:9120

komodo_image: ghcr.io/moghtech/komodo-core:v1.19.5@sha256:a1cceb4f971443b1e9f2a767788f663d0afb6244ee2135f7fe3fd1036af37ade
komodo_stack_name: komodo
komodo_stack_dir: /opt/ansible/komodo
komodo_mongo_uri: ""
komodo_mongo_uri_secret_name: komodo_mongo_uri  # pragma: allowlist secret

komodo_mongo_enabled: true
komodo_mongo_image: mongo:4.4.18
komodo_mongo_rs_name: rs0
komodo_mongo_member_hosts:
  - mongo-1
  - mongo-2
  - mongo-3
komodo_mongo_root_username: root
komodo_mongo_root_password_secret_name: komodo_mongo_root_password  # pragma: allowlist secret
komodo_mongo_keyfile_secret_name: komodo_mongo_keyfile  # pragma: allowlist secret
komodo_db_user: komodo_user
komodo_db_password_secret_name: komodo_db_password  # pragma: allowlist secret
komodo_mongo_readiness_retries: 30
komodo_mongo_readiness_delay: 4
