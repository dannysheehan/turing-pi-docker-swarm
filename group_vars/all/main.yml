---
ansible_user: dietpi
ansible_become: true

dietpi_min_version: "10.6"
# DietPi mode 0 delegates live time synchronization to Chrony. Replacement
# images use mode 4 until Ansible has installed Chrony.
dietpi_ntp_mode: 0
dietpi_firstboot_ntp_mode: 4
dietpi_ntp_mirror: default
dietpi_base_chrony_pool: 2.debian.pool.ntp.org
dietpi_base_chrony_max_correction_seconds: 0.05
dietpi_ramlog_size_mb: 50
dietpi_min_root_free_mb: 512

swarm_vip_prefix: 24
# Must match the single host in the primary_manager inventory group. Moved off
# tpi-mgr-01 on 2026-09-04 when its storage failed; move both back together
# once that node is repaired.
swarm_primary_manager: tpi-mgr-02
swarm_autolock: false

docker_dietpi_software_ids:
  - 162
  - 134
docker_data_root: /mnt/dietpi_userdata/docker-data
docker_engine_version: 29.7.2

# Shared NFS storage (mounted once per manager, apps bind subdirs).
nfs_mount: /srv/nfs
nfs_opts: "vers=3,hard,proto=tcp,timeo=600,retrans=2,_netdev,nofail,x-systemd.automount"
backup_passphrase: "{{ vault_backup_passphrase | default('') }}"

# Central log forwarding. RAMlog keeps /var/log in RAM, so the durable copy of
# a node's logs is the one on the syslog receiver. Without this, a node that
# hangs takes all its evidence with it -- which is exactly what happened to
# tpi-mgr-01 on 2026-08-29.
log_shipping_enabled: true
log_shipping_port: 514
log_shipping_protocol: udp

os_maintenance_patches: true
os_maintenance_reboot: true
keepalived_interface: eth0
keepalived_virtual_router_id: 51
keepalived_auth_pass: "{{ vault_keepalived_auth_pass | default('') }}"

# Traefik + Komodo (deployed by 04-services / traefik + komodo roles)
traefik_version: "v3.5"
traefik_stack_name: traefik
traefik_replicas: 3
traefik_stack_dir: /opt/ansible/traefik
traefik_edge_network: edge
traefik_backend_network: komodo_back
traefik_acme_storage_dir: /mnt/dietpi_userdata/traefik
traefik_komodo_backend_url: http://komodo-core:9120

komodo_image: ghcr.io/moghtech/komodo-core:2.3.2@sha256:7ae1d1547b16f1fd88902050105d80bbefc41b3023baf1f6dbc2b8df47ecb526
komodo_stack_name: komodo
komodo_stack_dir: /opt/ansible/komodo
# Derived from komodo_domain, which the ignored local.yml supplies. Keeping the
# real hostname out of the tracked tree matches hosts.yml.example and
# local.yml.example, which use the documentation ranges only.
komodo_host: "https://{{ komodo_domain }}"
komodo_local_auth: true
komodo_disable_user_registration: true
komodo_admin_username_secret_name: komodo_admin_username  # pragma: allowlist secret
komodo_admin_password_secret_name: komodo_admin_password  # pragma: allowlist secret
komodo_jwt_secret_name: komodo_jwt_secret  # pragma: allowlist secret
komodo_admin_username_secret_reference: op://Turing-Pi/Komodo/admin-username  # pragma: allowlist secret
komodo_admin_password_secret_reference: op://Turing-Pi/Komodo/admin-password  # pragma: allowlist secret
komodo_jwt_secret_reference: op://Turing-Pi/Komodo/jwt-secret  # pragma: allowlist secret

# Database tier: FerretDB v2 (MongoDB wire protocol) over an external
# PostgreSQL host carrying the DocumentDB extension.
#
# These nodes are Raspberry Pi CM3+ (Cortex-A53, ARMv8-A). MongoDB 5.0+ needs
# ARMv8.2-A LSE atomics, which this CPU does not implement, so stock MongoDB
# is permanently stuck at the end-of-life 4.4 series here. FerretDB is the
# upstream-documented path for hosts that cannot run current MongoDB.
#
# The database used to run as a Swarm service on one node's eMMC. That forced
# every Komodo service to be pinned to that node, and when its storage failed
# the tasks sat Pending against six healthy nodes they were not allowed to use.
# Moving Postgres off the cluster removed both the pinning and the single point
# of failure, and freed roughly a third of a 1GB node's memory.
komodo_ferretdb_image: ghcr.io/ferretdb/ferretdb:2.7.0@sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985
# The FerretDB image is distroless and runs as ferretdb:ferretdb (uid/gid 1000),
# so a root-owned secret would be unreadable to it.
komodo_ferretdb_uid: 1000
komodo_ferretdb_gid: 1000
# komodo_pg_host lives in the ignored local.yml: it is deployment-specific.
komodo_pg_port: 5432
komodo_pg_database: postgres
komodo_db_user: komodo_user
komodo_database_db_name: komodo
komodo_pg_password_secret_name: komodo_pg_password  # pragma: allowlist secret
komodo_ferretdb_url_secret_name: komodo_ferretdb_url  # pragma: allowlist secret

# Komodo's native scheduled backup (the "Backup Core Database" procedure)
# writes to /backups in the Core container. That is mounted from the NAS so a
# backup survives total loss of the node running the service. Dump files need
# no particular ownership, which matters because the export uses root_squash.
komodo_backups_nfs_server: "{{ nfs_server }}"
komodo_backups_nfs_path: "{{ nfs_export }}/backups/komodo"
# NFSv4 is not enabled on the NAS, so v3 it is. `hard` is good practice for any
# payload that must not silently return short reads.
komodo_backups_nfs_opts: "nfsvers=3,hard,proto=tcp,timeo=600,retrans=2"

# Core's /config holds the Noise keypair every enrolled Periphery agent
# authenticates against. On NFS rather than a node so Swarm can reschedule Core
# anywhere without regenerating the identity and breaking every agent.
komodo_config_nfs_server: "{{ nfs_server }}"
komodo_config_nfs_path: "{{ nfs_export }}/komodo-config"
komodo_config_nfs_opts: "nfsvers=3,hard,proto=tcp,timeo=600,retrans=2"

komodo_db_readiness_retries: 60
komodo_db_readiness_delay: 5

komodo_periphery_enabled: true
komodo_periphery_version: v2.3.2
komodo_periphery_checksum: sha256:67c107c2670ac3aa9202df57b92b706eee4fef9620e8fafe733d9df3a66b5a5b
komodo_periphery_root_directory: /etc/komodo
komodo_periphery_core_address: "{{ komodo_host }}"
komodo_periphery_outbound: true

# Komodo API bootstrap. A non-privileged onboarding key is created only when
# inventory hosts do not already exist in Komodo, then disabled after all
# Periphery connections and the Swarm resource have been verified.
komodo_onboarding_enabled: >-
  {{ komodo_enabled | bool and komodo_periphery_enabled | bool }}
komodo_onboarding_expiry_minutes: 30
komodo_onboarding_swarm_name: production-swarm
komodo_onboarding_swarm_send_unhealthy_alerts: true
# NOTE: files in group_vars/all/ load alphabetically and later files win, so
# anything defined here SHADOWS group_vars/all/local.yml. Deployment-specific
# values must therefore live only in local.yml, never here. Secure defaults for
# these keys come from roles/komodo_onboarding/defaults/main.yml, and the
# playbook-level uses apply `| default(true)`.
komodo_onboarding_rekey_servers: []
komodo_onboarding_rekey_confirm: false
