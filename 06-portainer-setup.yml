---
- name: Initialize a fresh Portainer administrator account
  hosts: primary_manager
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate the Portainer initialization endpoint
      ansible.builtin.assert:
        that:
          - inventory_hostname == portainer_primary_manager
          - portainer_enabled | bool
        fail_msg: >-
          Portainer initialization must run on the configured primary manager
          and requires Portainer to be enabled.

    - name: Check whether Portainer already has an administrator
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ portainer_https_port }}/api/users/admin/check"
        validate_certs: false
        status_code: [204, 404]
      register: portainer_admin_check
      check_mode: false

    - name: Require explicit approval and credentials for fresh initialization
      ansible.builtin.assert:
        that:
          - portainer_auto_setup | bool
          - portainer_admin_username | length > 0
          - portainer_admin_password | length >= 12
        fail_msg: >-
          No administrator exists. Set portainer_auto_setup=true and supply a
          vaulted administrator password of at least 12 characters before
          initializing this fresh installation.
      no_log: true
      when: portainer_admin_check.status == 404

    - name: Initialize the fresh Portainer installation
      when: portainer_admin_check.status == 404
      block:
        - name: Open a fresh Portainer setup window
          ansible.builtin.command:
            argv:
              - /usr/bin/docker
              - service
              - update
              - --force
              - "{{ portainer_stack_name }}_portainer"
          changed_when: true

        - name: Wait for the restarted Portainer API
          ansible.builtin.uri:
            url: "https://127.0.0.1:{{ portainer_https_port }}/api/system/status"
            validate_certs: false
            status_code: 200
          register: portainer_setup_api
          changed_when: false
          retries: 30
          delay: 2
          until: portainer_setup_api.status | default(0) == 200

        - name: Read the ephemeral setup token from the server task log
          ansible.builtin.command:
            argv:
              - /usr/bin/docker
              - service
              - logs
              - --since
              - 2m
              - --raw
              - "{{ portainer_stack_name }}_portainer"
          register: portainer_setup_logs
          changed_when: false
          retries: 15
          delay: 1
          until: >-
            'setup_token=' in
            (portainer_setup_logs.stdout ~ portainer_setup_logs.stderr)
          no_log: true

        - name: Extract the current Portainer setup token in memory
          ansible.builtin.set_fact:
            portainer_setup_token: >-
              {{
                (
                  (portainer_setup_logs.stdout ~ portainer_setup_logs.stderr)
                  | regex_findall('setup_token=.*?([0-9a-f]{64})')
                  | last
                )
              }}
          no_log: true

        - name: Create the initial Portainer administrator
          ansible.builtin.uri:
            url: "https://127.0.0.1:{{ portainer_https_port }}/api/users/admin/init"
            method: POST
            headers:
              X-Setup-Token: "{{ portainer_setup_token }}"
            body_format: json
            body:
              Username: "{{ portainer_admin_username }}"
              Password: "{{ portainer_admin_password }}"
            validate_certs: false
            status_code: [200, 201]
          no_log: true

    - name: Verify that the Portainer administrator exists
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ portainer_https_port }}/api/users/admin/check"
        validate_certs: false
        status_code: 204
      changed_when: false
