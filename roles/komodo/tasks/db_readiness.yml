---
# The database is external and owned by the DBA, so there is no local Postgres
# container to exec into and no first-time DocumentDB install to wait on. What
# has to be proven instead is that the host is reachable from the Swarm, that
# FerretDB accepted its connection, and that Core came up against it.

# block/rescue rather than failed_when/assert: `failed_when: false` would force
# the registered result's `failed` to False, so a reachability assert built on
# it could never fire.
- name: Verify the external Postgres host is reachable from the Swarm
  block:
    - name: Wait for the external Postgres port
      ansible.builtin.wait_for:
        host: "{{ komodo_pg_host }}"
        port: "{{ komodo_pg_port | int }}"
        timeout: 30
        state: started
  rescue:
    - name: Report an unreachable external database
      ansible.builtin.fail:
        msg: >-
          {{ komodo_pg_host }}:{{ komodo_pg_port }} is not reachable from
          {{ inventory_hostname }}. Komodo cannot start without it. Check the
          database host, its firewall, and that PostgreSQL is listening on an
          address the cluster can reach.

- name: Verify Komodo startup and report the failed dependency
  block:
    - name: Wait for the Komodo services to reach running state
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - service
          - ps
          - "{{ komodo_stack_name }}_{{ item }}"
          - --filter
          - desired-state=running
          - --format
          - "{{ '{{.CurrentState}}' }}"
      loop:
        - ferretdb
        - komodo-core
      register: komodo_service_check
      changed_when: false
      retries: "{{ komodo_db_readiness_retries }}"
      delay: "{{ komodo_db_readiness_delay }}"
      until:
        - komodo_service_check.rc == 0
        - komodo_service_check.stdout is search('^Running')
  rescue:
    - name: Collect task states and errors without truncation
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - stack
          - ps
          - "{{ komodo_stack_name }}"
          - --no-trunc
          - --format
          - "{{ '{{.Name}} | {{.Node}} | {{.CurrentState}} | {{.Error}}' }}"
      register: komodo_startup_diagnostics
      changed_when: false
      failed_when: false

    - name: Report why startup needs investigation
      ansible.builtin.fail:
        msg: |
          Komodo services did not reach Running state.
          {{ komodo_startup_diagnostics.stdout }}
          {{ komodo_startup_diagnostics.stderr }}
          Preparing: inspect the assigned node's Docker journal for image/DNS or mount errors.
          Core mount errors: restore the NAS; do not replace its /config identity.
          Running then failing: inspect service logs, the external database and the overlay.
          PostgreSQL needs DocumentDB in '{{ komodo_pg_database }}' and
          '{{ komodo_db_user }}' must belong to documentdb_admin_role.
          See RUNBOOK.md for recovery; this check does not force-update services.
