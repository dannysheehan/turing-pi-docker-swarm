---
komodo_enabled: false
komodo_image: ghcr.io/moghtech/komodo-core:2.3.2@sha256:7ae1d1547b16f1fd88902050105d80bbefc41b3023baf1f6dbc2b8df47ecb526
komodo_stack_name: komodo
komodo_stack_dir: /opt/ansible/komodo
komodo_domain: change-me.example.com
komodo_host: "https://{{ komodo_domain }}"
komodo_local_auth: true
komodo_disable_user_registration: true
komodo_admin_username_secret_name: komodo_admin_username  # pragma: allowlist secret
komodo_admin_password_secret_name: komodo_admin_password  # pragma: allowlist secret
komodo_jwt_secret_name: komodo_jwt_secret  # pragma: allowlist secret
komodo_admin_username_secret_reference: ""
komodo_admin_password_secret_reference: ""
komodo_jwt_secret_reference: ""

# Database tier: FerretDB v2 speaking the MongoDB wire protocol on top of an
# external PostgreSQL host carrying the DocumentDB extension.
#
# Stock MongoDB 5.0+ requires ARMv8.2-A with LSE atomics. The Cortex-A53 in a
# CM3+ implements ARMv8-A only, so MongoDB is permanently capped at the
# end-of-life 4.4 series here. FerretDB is the upstream-documented alternative
# for hosts that cannot run current MongoDB.
komodo_ferretdb_image: ghcr.io/ferretdb/ferretdb:2.7.0@sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985
# The FerretDB image is distroless and runs as ferretdb:ferretdb (uid/gid 1000),
# so a root-owned secret would be unreadable to it.
komodo_ferretdb_uid: 1000
komodo_ferretdb_gid: 1000

# External PostgreSQL carrying the DocumentDB extension. The database is no
# longer a Swarm service: it ran on one node's eMMC, which forced every Komodo
# service to be pinned there and made that node a single point of failure for
# the whole control plane.
#
# The DBA owns this host. Prerequisites, which this role asserts but does not
# create: the DocumentDB extension installed in komodo_pg_database, and
# komodo_db_user granted documentdb_admin_role. Individual table grants are not
# sufficient -- DocumentDB creates a table per collection at runtime, so a new
# collection would immediately fail without role membership.
komodo_pg_host: change-me.example.com
komodo_pg_port: 5432
# The PostgreSQL database that carries the DocumentDB extension. FerretDB maps
# every MongoDB database it serves into this single PostgreSQL database, so
# this is not the same name as komodo_database_db_name below.
komodo_pg_database: postgres
komodo_db_user: komodo_user
# The MongoDB-level database name Komodo Core uses inside FerretDB.
komodo_database_db_name: komodo

komodo_pg_password_secret_name: komodo_pg_password  # pragma: allowlist secret
komodo_pg_password_secret_reference: ""
komodo_ferretdb_url_secret_name: komodo_ferretdb_url  # pragma: allowlist secret

komodo_pg_password: >-
  {{
    (
      lookup('community.general.onepassword', komodo_pg_password_secret_reference)
      | b64encode | b64decode
    ) if (komodo_pg_password_secret_reference | length > 0) else ''
  }}

# Komodo's native scheduled backup (the "Backup Core Database" procedure)
# writes to /backups in the Core container. That is mounted from the NAS so a
# backup survives total loss of the node running the service. Dump files need
# no particular ownership, which matters because the export uses root_squash.
komodo_backups_nfs_server: "{{ nfs_server }}"
komodo_backups_nfs_path: "{{ nfs_export }}/backups/komodo"
# NFSv4 is not enabled on the NAS, so v3 it is. `hard` is good practice for any
# payload that must not silently return short reads.
komodo_backups_nfs_opts: "nfsvers=3,hard,proto=tcp,timeo=600,retrans=2"

# Core's /config holds the Noise keypair that every enrolled Periphery agent
# authenticates against. It lives on the NAS rather than on a node so Swarm can
# reschedule Core anywhere without regenerating the identity.
komodo_config_nfs_server: "{{ nfs_server }}"
komodo_config_nfs_path: "{{ nfs_export }}/komodo-config"
komodo_config_nfs_opts: "nfsvers=3,hard,proto=tcp,timeo=600,retrans=2"

komodo_db_readiness_retries: 60
komodo_db_readiness_delay: 5
