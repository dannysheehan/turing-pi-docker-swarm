---
- name: Validate Portainer deployment inputs
  ansible.builtin.assert:
    that:
      - inventory_hostname == portainer_primary_manager
      - portainer_primary_manager in groups['managers']
      - portainer_backup_passphrase | length >= 32
      - portainer_database_secret_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]+$')
      - portainer_database_secret_reference is match('^op://[^/]+/[^/]+/.+$')
    fail_msg: >-
      Portainer must run from its configured manager and its backup passphrase
      must contain at least 32 characters. Its database encryption key must be
      a valid op:// reference.

- name: Synchronize the Portainer database key into Swarm
  ansible.builtin.include_role:
    name: swarm_secrets
  vars:
    swarm_secrets_definitions:
      - name: "{{ portainer_database_secret_name }}"
        source: "{{ portainer_database_secret_reference }}"
        required_length: 32
        ascii_only: true
        rotation_policy: forbid
        consumer_service: "{{ portainer_stack_name }}_portainer"
        consumer_target: portainer
        initial_activation_confirm: "{{ portainer_database_encryption_confirm }}"

- name: Create Portainer local data directory
  ansible.builtin.file:
    path: "{{ portainer_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect an existing Portainer service
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - service
      - inspect
      - "{{ portainer_stack_name }}_portainer"
      - --format
      - "{{ '{{json .Spec.TaskTemplate.ContainerSpec.Mounts}}' }}"
  register: portainer_existing_mounts
  changed_when: false
  failed_when: false

- name: Inspect local Portainer data contents
  ansible.builtin.find:
    paths: "{{ portainer_data_dir }}"
    hidden: true
    recurse: false
  register: portainer_local_contents

- name: Refuse an implicit Portainer data migration
  ansible.builtin.assert:
    that:
      - >-
        portainer_existing_mounts.rc != 0 or
        portainer_data_dir in portainer_existing_mounts.stdout or
        portainer_local_contents.matched | int > 0
    fail_msg: >-
      The running Portainer service does not use the local data directory and
      that directory is empty. Stop here and perform an explicitly planned,
      backed-up data migration; ordinary convergence never moves application
      data automatically.

- name: Create the Portainer deployment directory
  ansible.builtin.file:
    path: "{{ portainer_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render the Portainer Swarm stack
  ansible.builtin.template:
    src: portainer-stack.yml.j2
    dest: "{{ portainer_stack_dir }}/portainer-stack.yml"
    owner: root
    group: root
    mode: "0640"
  register: portainer_stack_template

- name: Deploy the Portainer Swarm stack
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - stack
      - deploy
      - --prune
      - --compose-file
      - "{{ portainer_stack_dir }}/portainer-stack.yml"
      - "{{ portainer_stack_name }}"
  register: portainer_stack_deploy
  changed_when: >-
    portainer_stack_template.changed or portainer_existing_mounts.rc != 0

- name: Wait for one healthy Portainer server task
  ansible.builtin.shell: >-
    set -o pipefail && test "$(docker service ps --filter desired-state=running
    --format '{{ '{{' }}.CurrentState{{ '}}' }}'
    {{ portainer_stack_name }}_portainer | grep -c '^Running')" -eq 1
  args:
    executable: /bin/bash
  register: portainer_server_ready
  changed_when: false
  retries: 30
  delay: 4
  until: portainer_server_ready.rc == 0

- name: Wait for one Portainer agent task per node
  ansible.builtin.shell: >-
    set -o pipefail && test "$(docker service ps --filter desired-state=running
    --format '{{ '{{' }}.CurrentState{{ '}}' }}'
    {{ portainer_stack_name }}_agent | grep -c '^Running')" -eq {{ groups['cluster'] | length }}
  args:
    executable: /bin/bash
  register: portainer_agents_ready
  changed_when: false
  retries: 30
  delay: 4
  until: portainer_agents_ready.rc == 0

- name: Inspect the accepted Portainer server secret
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - service
      - inspect
      - "{{ portainer_stack_name }}_portainer"
      - --format
      - "{{ '{{json .Spec.TaskTemplate.ContainerSpec.Secrets}}' }}"
  register: portainer_deployed_secrets
  changed_when: false
  check_mode: false

- name: Require Portainer to use the resolved database secret
  ansible.builtin.assert:
    that:
      - >-
        (
          (portainer_deployed_secrets.stdout | from_json | default([], true))
          | selectattr('File.Name', 'equalto', 'portainer')
          | map(attribute='SecretName')
          | list
          | first
        ) == swarm_secrets_resolved_names[portainer_database_secret_name]
    fail_msg: >-
      Portainer is healthy but is not mounted to the resolved database
      encryption secret. Superseded secrets will not be removed.

- name: Wait for the Portainer HTTPS API
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ portainer_https_port }}/api/system/status"
    method: GET
    validate_certs: false
    status_code: 200
    return_content: false
  register: portainer_api_ready
  changed_when: false
  retries: 30
  delay: 4
  until: portainer_api_ready.status | default(0) == 200

- name: Remove superseded Portainer database secrets after acceptance
  ansible.builtin.include_role:
    name: swarm_secrets
    tasks_from: cleanup
  vars:
    swarm_secrets_definitions:
      - name: "{{ portainer_database_secret_name }}"
        source: "{{ portainer_database_secret_reference }}"
        required_length: 32
        ascii_only: true
        rotation_policy: forbid
        consumer_service: "{{ portainer_stack_name }}_portainer"
        consumer_target: portainer
        initial_activation_confirm: "{{ portainer_database_encryption_confirm }}"

- name: Install Portainer backup dependencies
  ansible.builtin.apt:
    name:
      - openssl
      - tar
    state: present

- name: Create the root-only Portainer backup configuration directory
  ansible.builtin.file:
    path: "{{ portainer_backup_secret_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Store the encrypted-backup passphrase
  ansible.builtin.copy:
    content: "{{ portainer_backup_passphrase }}\n"
    dest: "{{ portainer_backup_secret_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the consistent Portainer backup program
  ansible.builtin.template:
    src: portainer-backup.sh.j2
    dest: /usr/local/sbin/portainer-backup
    owner: root
    group: root
    mode: "0700"

- name: Install the Portainer backup service
  ansible.builtin.template:
    src: portainer-backup.service.j2
    dest: /etc/systemd/system/portainer-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install and enable the Portainer backup timer
  ansible.builtin.template:
    src: portainer-backup.timer.j2
    dest: /etc/systemd/system/portainer-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd configuration handlers
  ansible.builtin.meta: flush_handlers

- name: Enable the Portainer backup timer
  ansible.builtin.systemd_service:
    name: portainer-backup.timer
    enabled: true
    state: started
