---
- name: Parse configured NFS mount options
  ansible.builtin.set_fact:
    nfs_common_configured_options: "{{ nfs_opts.split(',') }}"

- name: Validate NFS mount policy
  ansible.builtin.assert:
    that:
      - nfs_common_configured_options | difference(nfs_common_allowed_options) | length == 0
      - nfs_common_rejected_options | intersect(nfs_common_configured_options) | length == 0
      - "'hard' in nfs_common_configured_options"
    fail_msg: >-
      nfs_opts contains an unsafe or unknown option. Use only the repository's
      hard, TCP, systemd-automount policy.

- name: Install the NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true

- name: Inspect the NFS mount point path
  ansible.builtin.stat:
    path: "{{ nfs_mount }}"
  register: nfs_common_mountpoint_path

- name: Create the NFS mount point only when absent
  ansible.builtin.file:
    path: "{{ nfs_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not nfs_common_mountpoint_path.stat.exists

- name: Require an existing mount point to be a directory
  ansible.builtin.assert:
    that:
      - not nfs_common_mountpoint_path.stat.exists or nfs_common_mountpoint_path.stat.isdir
    fail_msg: "{{ nfs_mount }} exists but is not a directory."

- name: Read parsed fstab entries for the NFS mount point
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - -v
      - "mountpoint={{ nfs_mount }}"
      - '$2 == mountpoint { print $1 "|" $2 "|" $3 "|" $4 "|" $5 "|" $6 }'
      - /etc/fstab
  register: nfs_common_fstab_entries
  changed_when: false
  check_mode: false

- name: Calculate the canonical NFS fstab entry
  ansible.builtin.set_fact:
    nfs_common_canonical_fstab_entry: >-
      {{ nfs_server }}:{{ nfs_export }}|{{ nfs_mount }}|nfs|{{ nfs_opts }}|0|0

- name: Remove legacy or duplicate fstab entries for the NFS mount point
  ansible.posix.mount:
    path: "{{ nfs_mount }}"
    state: absent_from_fstab
  when: nfs_common_fstab_entries.stdout_lines != [nfs_common_canonical_fstab_entry]

- name: Install one canonical NFS automount entry
  ansible.posix.mount:
    path: "{{ nfs_mount }}"
    src: "{{ nfs_server }}:{{ nfs_export }}"
    fstype: nfs
    opts: "{{ nfs_opts }}"
    state: mounted

- name: Verify the live NFS mount source and options
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE,OPTIONS
      - --target
      - "{{ nfs_mount }}"
  register: nfs_common_findmnt
  changed_when: false
  check_mode: false

- name: Require the expected hard NFS mount
  ansible.builtin.assert:
    that:
      - nfs_server ~ ':' ~ nfs_export in nfs_common_findmnt.stdout
      - "'nfs' in nfs_common_findmnt.stdout"
      - "'hard' in nfs_common_findmnt.stdout"
      - "'soft' not in nfs_common_findmnt.stdout"

- name: Inspect shared backup directories
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ nfs_mount }}/backups"
    - "{{ nfs_mount }}/backups/portainer"
    - "{{ nfs_mount }}/backups/swarm"
  register: nfs_common_backup_directories

- name: Create missing shared backup directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    mode: "0700"
  loop: "{{ nfs_common_backup_directories.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Require existing shared backup paths to be directories
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
    fail_msg: "{{ item.item }} exists but is not a directory."
  loop: "{{ nfs_common_backup_directories.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
