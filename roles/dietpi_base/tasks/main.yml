---
- name: Reconcile persistent hostname
  ansible.builtin.copy:
    dest: /etc/hostname
    content: "{{ inventory_hostname }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Read live hostname
  ansible.builtin.command:
    argv: [/bin/hostname]
  register: dietpi_base_live_hostname
  changed_when: false
  check_mode: false

- name: Reconcile live hostname without DBus
  ansible.builtin.command:
    argv: [/bin/hostname, "{{ inventory_hostname }}"]
  changed_when: true
  when: dietpi_base_live_hostname.stdout | trim != inventory_hostname

- name: Reconcile timezone name
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ timezone }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Reconcile timezone symlink
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    owner: root
    group: root
    force: true

- name: Read existing host mappings
  ansible.builtin.slurp:
    src: /etc/hosts
  register: dietpi_base_hosts_file

- name: Remove a previous managed block from the host mapping source
  ansible.builtin.set_fact:
    dietpi_base_hosts_unmanaged: >-
      {{
        dietpi_base_hosts_file.content | b64decode |
        regex_replace(
          '(?ms)^# BEGIN ANSIBLE MANAGED CLUSTER HOSTS$.*?^# END ANSIBLE MANAGED CLUSTER HOSTS$\\n?',
          ''
        )
      }}

- name: Build the legacy cluster mapping expression
  ansible.builtin.set_fact:
    dietpi_base_legacy_hosts_pattern: >-
      (?m)^(?:{%- for cluster_host in groups['cluster'] -%}
      {{ hostvars[cluster_host].ansible_host | regex_escape }} {{ cluster_host | regex_escape }}{%- if not loop.last -%}|{%- endif -%}
      {%- endfor -%})$\n?

- name: Remove legacy cluster mappings from the host mapping source
  ansible.builtin.set_fact:
    dietpi_base_hosts_unmanaged: >-
      {{
        dietpi_base_hosts_unmanaged |
        regex_replace(dietpi_base_legacy_hosts_pattern, '')
      }}

- name: Reconcile one cluster host mapping block
  ansible.builtin.copy:
    dest: /etc/hosts
    content: |
      {{ dietpi_base_hosts_unmanaged | regex_replace('\n*$', '') }}
      # BEGIN ANSIBLE MANAGED CLUSTER HOSTS
      {% for cluster_host in groups['cluster'] %}
      {{ hostvars[cluster_host].ansible_host }} {{ cluster_host }}
      {% endfor %}
      # END ANSIBLE MANAGED CLUSTER HOSTS
    owner: root
    group: root
    mode: "0644"

- name: Reconcile DietPi NTP mirror
  ansible.builtin.lineinfile:
    path: /boot/dietpi.txt
    regexp: '^CONFIG_NTP_MIRROR='
    line: "CONFIG_NTP_MIRROR={{ dietpi_ntp_mirror }}"
    mode: "0644"
  register: dietpi_base_ntp_mirror

- name: Read configured DietPi NTP mode
  ansible.builtin.shell: |
    set -o pipefail
    sed -n 's/^CONFIG_NTP_MODE=//p' /boot/dietpi.txt | head -1
  args:
    executable: /bin/bash
  register: dietpi_base_ntp_mode
  changed_when: false
  check_mode: false

- name: Calculate whether DietPi time configuration must change
  ansible.builtin.set_fact:
    dietpi_base_ntp_change_required: >-
      {{ dietpi_base_ntp_mode.stdout | trim != dietpi_ntp_mode | string
         or dietpi_base_ntp_mirror.changed }}

- name: Delegate live time synchronization to an external daemon through DietPi
  ansible.builtin.command:
    argv:
      - /boot/dietpi/func/dietpi-set_software
      - ntpd-mode
      - "{{ dietpi_ntp_mode | string }}"
  when: dietpi_base_ntp_change_required
  changed_when: true

- name: Inspect whether the Chrony executable is already installed
  ansible.builtin.stat:
    path: /usr/sbin/chronyd
  register: dietpi_base_chronyd_executable

- name: Determine whether live Chrony checks are meaningful
  ansible.builtin.set_fact:
    dietpi_base_chrony_runtime_checks_available: >-
      {{ not ansible_check_mode
         or (dietpi_base_chronyd_executable.stat.exists
             and not dietpi_base_ntp_change_required) }}

- name: Install Chrony from the node's Debian release repository
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Chrony as a client with multiple pool sources
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    validate: >-
      {{ '/usr/sbin/chronyd -p -f %s'
         if not ansible_check_mode or dietpi_base_chronyd_executable.stat.exists
         else omit }}
  notify: Restart Chrony
  when: not ansible_check_mode or dietpi_base_chronyd_executable.stat.exists

- name: Enable DietPi APT update reporting without automatic upgrades
  ansible.builtin.lineinfile:
    path: /boot/dietpi.txt
    regexp: '^CONFIG_CHECK_APT_UPDATES='
    line: CONFIG_CHECK_APT_UPDATES=1
    mode: "0644"

- name: Apply pending Chrony configuration before validation
  ansible.builtin.meta: flush_handlers

- name: Verify Chrony is enabled and active
  ansible.builtin.systemd_service:
    name: chrony.service
    state: started
    enabled: true
  register: dietpi_base_chrony_service
  retries: 12
  delay: 5
  until: dietpi_base_chrony_service.status.ActiveState == 'active'
  when: dietpi_base_chrony_runtime_checks_available

- name: Wait for Chrony to synchronize within the required clock error
  ansible.builtin.command:
    argv:
      - /usr/bin/chronyc
      - -n
      - waitsync
      - "30"
      - "{{ dietpi_base_chrony_max_correction_seconds | string }}"
      - "{{ dietpi_base_chrony_max_skew_ppm | string }}"
      - "2"
  register: dietpi_base_chrony_waitsync
  changed_when: false
  check_mode: false
  when: dietpi_base_chrony_runtime_checks_available

- name: Inspect Chrony source selection
  ansible.builtin.command:
    argv: [/usr/bin/chronyc, -n, sources]
  register: dietpi_base_chrony_sources
  changed_when: false
  check_mode: false
  when: dietpi_base_chrony_runtime_checks_available

- name: Require Chrony to have selected a network time source
  ansible.builtin.assert:
    that:
      - dietpi_base_chrony_sources.stdout is search('(?m)^\^\*')
    fail_msg: Chrony is running but has not selected a network time source.
  when: dietpi_base_chrony_runtime_checks_available

- name: Inspect the DietPi timesyncd service state
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, is-active, systemd-timesyncd.service]
  register: dietpi_base_timesyncd_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require the competing DietPi timesyncd daemon to remain inactive
  ansible.builtin.assert:
    that:
      - dietpi_base_timesyncd_state.stdout | trim != 'active'
    fail_msg: systemd-timesyncd is active alongside Chrony; only one time daemon may control the clock.
  when: dietpi_base_chrony_runtime_checks_available

- name: Read the live DietPi RAMlog configuration
  ansible.builtin.slurp:
    src: /boot/dietpi.txt
  register: dietpi_base_configuration

- name: Inspect DietPi RAMlog
  ansible.builtin.command: findmnt --noheadings --output FSTYPE,OPTIONS /var/log
  register: dietpi_base_ramlog
  changed_when: false
  check_mode: false

- name: Inspect DietPi RAMlog service
  ansible.builtin.systemd_service:
    name: dietpi-ramlog.service
  register: dietpi_base_ramlog_service
  changed_when: false

- name: Verify DietPi RAMlog remains active and bounded
  ansible.builtin.assert:
    that:
      - dietpi_base_ramlog.stdout is search('tmpfs')
      - dietpi_base_ramlog.stdout is search('size=' ~ (dietpi_ramlog_size_mb | int * 1024) ~ 'k')
      - dietpi_base_ramlog_service.status.ActiveState == 'active'
      - >-
        dietpi_base_configuration.content | b64decode is
        search('(?m)^AUTO_SETUP_RAMLOG_MAXSIZE=' ~ dietpi_ramlog_size_mb ~ '$')
